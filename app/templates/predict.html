{% extends 'base.html' %}
{% block content %}
<h2>Predict</h2>
<form method="POST" class="mt-3 card">
    <div class="mb-3">
        <label>Upcoming Games</label>
        <p>Choose one of the following games:</p>
        <select name="game" class="form-control" required>
            {% for game in upcoming_games %}
            <option value="{{ game }}">{{ game }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-success">Predict this game</button>
</form>
<div class="card mt-3 d-flex justify-content-center">
    <p>This is where output will be</p>
</div>
{% endblock %}
